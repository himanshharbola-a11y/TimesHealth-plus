# TimesHealth+ API (Spring Boot). Every setting that the Node server reads from the environment
# is bound here from the SAME variable name (apps/api/src/env.ts), so one .env serves both.
# The Spring profile follows NODE_ENV (config/NodeEnvPostProcessors.kt):
#   development/unset -> dev, test -> test, anything else -> prod.
# DATABASE_URL (Prisma format) becomes spring.datasource.* in the same file.

server:
  port: ${PORT:4000}
  address: ${HOST:0.0.0.0}
  # Client IPs come from X-Forwarded-For under TRUST_PROXY_HOPS (web/ClientIp.kt), exactly like
  # Fastify's trustProxy. Tomcat must not rewrite the remote address itself.
  forward-headers-strategy: none
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: timeshealth-api
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      # Health checks and auth must fail fast (503) when the database is unreachable, not hang.
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Validation proves every entity matches it at boot.
      ddl-auto: validate
      naming:
        # Prisma's names exactly as written: "User", "YogaSubscription", "firebaseUid".
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        jdbc:
          # Prisma stores DateTime as TIMESTAMP(3) WITHOUT time zone, holding UTC wall-clock time.
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
          # jsonb columns go through kotlinx.serialization, never Jackson.
          json_format_mapper: timeshealth.server.db.KotlinxJsonFormatMapper
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases Prisma created (local docker, the Neon staging DB) are adopted at V1 without
    # running it; an empty database is built by V1__baseline.sql.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Prisma schema (adopted)
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false

th:
  env:
    node-env: ${NODE_ENV:development}
    firebase-service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}
    firebase-service-account-b64: ${FIREBASE_SERVICE_ACCOUNT_B64:}
    firebase-project-id: ${FIREBASE_PROJECT_ID:}
    allow-dev-tokens: ${ALLOW_DEV_TOKENS:}
    public-tunnel: ${PUBLIC_TUNNEL:}
    auth-provider: ${AUTH_PROVIDER:firebase}
    trust-proxy-hops: ${TRUST_PROXY_HOPS:1}
    bib-signing-secret: ${BIB_SIGNING_SECRET:}
    bib-token-ttl-seconds: ${BIB_TOKEN_TTL_SECONDS:60}
    media-signing-secret: ${MEDIA_SIGNING_SECRET:}
    wa-join-signing-secret: ${WA_JOIN_SIGNING_SECRET:}
    share-base-url: ${SHARE_BASE_URL:https://timeshealthplus.invalid}
    scanner-keys: ${SCANNER_KEYS:}
    yoga-renew-url: ${YOGA_RENEW_URL:https://timeshealthplus.invalid/yoga}
    media-url-ttl-seconds: ${MEDIA_URL_TTL_SECONDS:300}
    media-base-url: ${MEDIA_BASE_URL:https://media.timeshealthplus.invalid}
    diet-lead-webhook-url: ${DIET_LEAD_WEBHOOK_URL:}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    cors-origins: ${CORS_ORIGINS:*}
    yoga-class-link: ${YOGA_CLASS_LINK:https://timeshealthplus.invalid/live}
    # Kotlin-only settings (not read by the Node server).
    node-upstream-url: ${NODE_UPSTREAM_URL:}
    admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    admin-session-secret: ${ADMIN_SESSION_SECRET:}
  demo:
    # none | seed | personas | all  (DEMO_DATA=all ./gradlew bootRun, or ./gradlew loadDemoData)
    load: ${DEMO_DATA:none}
    exit-after-load: false

logging:
  level:
    root: INFO
    # Never DEBUG in any profile: Spring's web DEBUG lines carry full request URLs.
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
